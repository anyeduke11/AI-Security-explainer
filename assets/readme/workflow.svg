<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">学习闭环：九大知识域 → 七种学习形式 → 五项配套功能 → 学习进度</title>
  <desc id="wf-desc">四个阶段从左到右排列，由箭头连接，最后从学习进度返回知识域形成闭环。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6ff0"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6a8c"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="26" fill="#0b1120"/>

  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#7ba3ff">HOW IT WORKS</text>
  <text x="48" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="33" font-weight="650" fill="#ffffff">从知识到熟练，一条可回环的路径</text>

  <!-- 四个阶段卡片 -->
  <g id="stages" transform="translate(48 132)">
    <g transform="translate(0 0)">
      <rect width="255" height="128" rx="16" fill="#111d38" stroke="#22304f" stroke-width="2"/>
      <text x="20" y="40" font-family="ui-monospace, monospace" font-size="18" fill="#7ba3ff">01 / SELECT</text>
      <text x="20" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#ffffff">9</text>
      <text x="62" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="21" fill="#c2d0ea">大知识域</text>
      <text x="20" y="114" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#7d92bb">152 条风险条目</text>
    </g>
    <g transform="translate(300 0)">
      <rect width="255" height="128" rx="16" fill="#111d38" stroke="#22304f" stroke-width="2"/>
      <text x="20" y="40" font-family="ui-monospace, monospace" font-size="18" fill="#7ba3ff">02 / LEARN</text>
      <text x="20" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#ffffff">7</text>
      <text x="62" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="21" fill="#c2d0ea">种学习形式</text>
      <text x="20" y="114" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#7d92bb">卡片 · 拆解 · 演示 · 小测</text>
    </g>
    <g transform="translate(600 0)">
      <rect width="255" height="128" rx="16" fill="#111d38" stroke="#22304f" stroke-width="2"/>
      <text x="20" y="40" font-family="ui-monospace, monospace" font-size="18" fill="#7ba3ff">03 / PRACTICE</text>
      <text x="20" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#ffffff">5</text>
      <text x="62" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="21" fill="#c2d0ea">项配套功能</text>
      <text x="20" y="114" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#7d92bb">实验室 · 热度 · 路径 · 测验</text>
    </g>
    <g transform="translate(900 0)">
      <rect width="255" height="128" rx="16" fill="#141a30" stroke="#dc4c43" stroke-width="2"/>
      <text x="20" y="40" font-family="ui-monospace, monospace" font-size="18" fill="#e88b84">04 / MEASURE</text>
      <text x="20" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#ffffff">785</text>
      <text x="112" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="21" fill="#c2d0ea">题</text>
      <text x="20" y="114" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#7d92bb">本地进度与错题本</text>
    </g>
  </g>

  <!-- 阶段间箭头 -->
  <g stroke="#3f6ff0" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="304" y1="196" x2="318" y2="196"/>
    <line x1="604" y1="196" x2="618" y2="196"/>
    <line x1="904" y1="196" x2="918" y2="196"/>
  </g>

  <!-- 回环箭头 -->
  <path d="M 1028 274 Q 1028 302 998 302 L 202 302 Q 172 302 172 274"
        fill="none" stroke="#5a6a8c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-back)"/>
  <text x="600" y="296" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#8fa8d4">错题与薄弱知识域回流，重新学习</text>
</svg>
